<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · TopReview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@300;400;500;700&display=swap">
<style>
  /* Acceso: tarjeta blanca sobre gris claro con cabecera petróleo (marca LabHour). */
  :root { --cream:#F7F7F7; --navy:#202427; --klein:#14636D; --klein-dark:#0F535C; --muted:#6B6F72; --line:#E3E6E7; --bad:#c92a42; --star:#FFC600;
    --display:Fraunces, Georgia, serif; --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--cream); font-family:var(--body); color:var(--navy); padding:24px 16px; }
  .card { width:100%; max-width:380px; background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:0 1px 2px rgba(32,36,39,.04),0 6px 24px rgba(32,36,39,.06); }
  .top { background:var(--klein); color:#fff; text-align:center; padding:26px 20px 24px; }
  .brand { font-family:var(--display); font-weight:700; font-size:40px; line-height:1; letter-spacing:.02em; }
  .brand span { color:#C9EBE5; }

  form { padding:28px 22px 22px; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:20px; margin:0; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:5px; }
  input { font:inherit; width:100%; border:1px solid #CDD2D4; border-radius:12px; padding:12px 14px; color:var(--navy); background:#fff; }
  input:focus { outline:2px solid var(--klein); outline-offset:1px; border-color:transparent; }
  button { font:700 16px var(--body); background:var(--klein); color:#fff; border:0; border-radius:99px; padding:14px; cursor:pointer; margin-top:4px; }
  button:hover { background:var(--klein-dark); }
  .err { background:#FBE4E0; color:var(--bad); border-radius:10px; padding:9px 12px; font-size:14px; }
  .note { font-size:12px; color:var(--muted); text-align:center; margin:0; }
</style>
</head>
<body>
  <main class="card">
    <div class="top">
      <div class="brand">Top<span>Review</span></div>
    </div>
    <form method="post" action="/login">
      <h1>Entrar</h1>
      <div class="err" id="err" hidden></div>
      <div><label for="user">Usuario</label><input id="user" name="user" autocomplete="username" autocapitalize="none" required autofocus></div>
      <div><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <input type="hidden" name="next" id="next">
      <button>Entrar</button>
      <p class="note">¿No tienes acceso? Pídeselo a quien gestiona tu local.</p>
    </form>
  </main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('next').value = q.get('next') || '';
  const msg = { datos: 'Usuario o contraseña incorrectos.', espera: 'Demasiados intentos. Espera unos minutos y vuelve a probar.' }[q.get('e')];
  if (msg) { const e = document.getElementById('err'); e.textContent = msg; e.hidden = false; }
</script>
</body>
</html>
